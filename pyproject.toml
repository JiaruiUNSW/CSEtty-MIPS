[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csetty-mips"
version = "0.1.0"
description = "An independent educational MIPS32 assembler, simulator, and debugger"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
csetty-mips = "csetty_mips.cli:main"

[project.urls]
Homepage = "https://github.com/JiaruiUNSW/CSEtty_MIPS"
Repository = "https://github.com/JiaruiUNSW/CSEtty_MIPS.git"
Issues = "https://github.com/JiaruiUNSW/CSEtty_MIPS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csetty_mips = ["NOTICE", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["csetty_mips"]
